name: Release AA Desk

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content src/DownloadsStack/DownloadsStack.csproj)
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Check whether release exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { 'exists=true' >> $env:GITHUB_OUTPUT }
          else { 'exists=false' >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Build and test installer
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $setup = "artifacts/AADesk-$env:VERSION-setup-win-x64.exe"
          $hash = "$setup.sha256"
          $msi = "artifacts/AADesk-$env:VERSION-win-x64.msi"
          $portable = "artifacts/AADesk-$env:VERSION-portable-win-x64.zip"
          foreach ($path in @($setup, $hash, $msi, $portable)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release asset: $path" }
          }
          gh release create $env:TAG $setup $hash $msi $portable `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "AA Desk $env:VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
