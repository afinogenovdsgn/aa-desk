<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AA Desk — настройки</title>
<style>
:root{color-scheme:dark;--bg:#242424;--rail:#202020;--panel:#292929;--line:#3b3b3b;--text:#f5f5f5;--muted:#a9a9a9;--accent:#50c8f2;--accent-soft:#164657;--hover:#343434}
*{box-sizing:border-box}body{margin:0;background:#171717;color:var(--text);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",Arial,sans-serif}.window{width:min(900px,100vw);height:min(650px,100vh);min-height:520px;margin:0 auto;background:var(--bg);border:1px solid #414141;display:flex;flex-direction:column;box-shadow:0 18px 70px #0008}.titlebar{height:36px;flex:none;display:flex;align-items:center;gap:9px;padding-left:11px;background:#303030;border-bottom:1px solid #3b3b3b;user-select:none}.appmark{width:16px;height:16px;border:1px solid #88ddfa;border-radius:4px;display:grid;place-items:center;color:#78d9f8;font-size:10px;font-weight:700}.title{flex:1}.winbtn{width:44px;height:35px;display:grid;place-items:center;color:#ddd;font-size:15px}.winbtn.close:hover{background:#c42b1c}.body{display:flex;flex:1;min-height:0}.sidebar{width:190px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:104px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.logo-placeholder{width:120px;height:62px;border:1px dashed #686868;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;color:#aeb7bb;font-size:11px;letter-spacing:.04em}.logo-glyph{width:27px;height:27px;border:1.5px solid #7ed8f5;border-radius:6px;display:grid;place-items:center;color:#7ed8f5;font-weight:600;font-size:16px}.nav{padding:10px 8px;display:grid;gap:3px}.nav button{font:inherit;text-align:left;color:#d4d4d4;background:transparent;border:0;border-radius:5px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:11px}.nav button:hover{background:var(--hover)}.nav button.active{background:var(--accent-soft);color:#e9faff;box-shadow:inset 2px 0 #4ec7f2}.nav .ico{font-size:16px;width:20px;text-align:center;color:#bdbdbd}.nav .active .ico{color:var(--accent)}.nav .check{margin-left:auto;width:16px;height:16px;accent-color:#38bce9}.nav .divider{height:1px;background:#3b3b3b;margin:7px 5px}.nav .section-label{font-size:10px;text-transform:uppercase;color:#8d8d8d;letter-spacing:.09em;padding:7px 10px 2px}.spacer{flex:1}.sidebar-foot{padding:9px 16px;color:#888;font-size:11px;border-top:1px solid #333}.main{flex:1;min-width:0;display:flex;flex-direction:column}.content{padding:25px 30px 20px;overflow:auto;flex:1}.eyebrow{font-size:11px;letter-spacing:.1em;color:#8ca7b2;text-transform:uppercase;margin:2px 0 6px}.h1{font-size:21px;font-weight:600;margin:0 0 6px}.desc{font-size:12px;color:var(--muted);margin-bottom:22px}.group-title{font-size:11px;letter-spacing:.08em;color:#8ca7b2;text-transform:uppercase;margin:22px 0 9px}.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#282828}.row{min-height:49px;padding:10px 14px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #393939}.row:last-child{border-bottom:0}.row-label{flex:1;font-weight:600}.hint{font-size:11px;color:#999;font-weight:400;margin-top:2px}.control{min-width:180px;display:flex;align-items:center;justify-content:flex-end;gap:8px}.select,.text-input{height:31px;min-width:174px;padding:0 10px;border:1px solid #616161;border-radius:5px;background:#303030;color:#f6f6f6;font:inherit}.text-input{min-width:220px}.toggle{width:38px;height:20px;border:0;border-radius:12px;background:#555;position:relative;cursor:pointer}.toggle:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:white;left:3px;top:3px;transition:.15s}.toggle.on{background:#147da1}.toggle.on:before{left:21px}.check-row{display:flex;align-items:center;gap:10px;color:#ddd}.check-row input{accent-color:#37bce9;width:16px;height:16px}.info{width:15px;height:15px;border:1px solid #777;color:#aaa;border-radius:50%;font-size:10px;display:grid;place-items:center}.bottom{height:35px;flex:none;border-top:1px solid var(--line);background:#222;display:flex;align-items:center;padding:0 13px;gap:8px;font-size:11px;color:#b6b6b6}.status-dot{width:7px;height:7px;background:#66cbe9;border-radius:50%}.bottom-spacer{flex:1}.update{color:#83c9e2;cursor:pointer}.update:hover{text-decoration:underline}.version{color:#888}.module-toggle{display:flex;align-items:center;gap:8px}.module-toggle input{accent-color:#36bce8;width:15px;height:15px}.module-tag{font-size:10px;color:#888;border:1px solid #505050;border-radius:4px;padding:2px 5px}.empty-hint{padding:13px 14px;color:#999;font-size:11px;border-top:1px solid #3b3b3b}.button{border:1px solid #555;background:#343434;color:#eee;border-radius:5px;padding:6px 12px;cursor:pointer}.button:hover{background:#414141}.button.primary{border-color:#147da1;background:#125d76}.toast{position:fixed;right:20px;bottom:52px;background:#303030;border:1px solid #555;border-radius:6px;padding:10px 14px;box-shadow:0 5px 20px #0008;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
</style></head>
<body>
<div class="window">
  <header class="titlebar"><div class="appmark">A</div><div class="title">AA Desk</div><div class="winbtn" aria-label="Свернуть">—</div><div class="winbtn" aria-label="Развернуть">□</div><div class="winbtn close" aria-label="Закрыть">×</div></header>
  <div class="body">
    <aside class="sidebar">
      <div class="brand"><div class="logo-placeholder"><span class="logo-glyph">A</span><span>ЛОГОТИП</span></div></div>
      <nav class="nav" aria-label="Настройки">
        <div class="section-label">Модули AA Desk</div>
        <button class="active" data-page="general"><span class="ico">⚙</span><span>Общие</span></button>
        <button data-page="explorer"><span class="ico">⌕</span><span>Smart Explorer</span><input class="check" type="checkbox" checked aria-label="Включить Smart Explorer" onclick="event.stopPropagation()"></button>
        <button data-page="downloader"><span class="ico">⇩</span><span>Downloader</span><input class="check" type="checkbox" checked aria-label="Включить Downloader" onclick="event.stopPropagation()"></button>
        <div class="divider"></div><div class="section-label">Приложение</div>
        <button data-page="about"><span class="ico">ⓘ</span><span>О программе</span></button>
      </nav><div class="spacer"></div><div class="sidebar-foot">Настройки приложения</div>
    </aside>
    <main class="main"><div class="content" id="content"></div>
      <footer class="bottom"><span class="status-dot"></span><span>AA Desk</span><span class="bottom-spacer"></span><span class="update" id="update">Проверить наличие обновлений</span><span class="version">· v0.1.0</span></footer>
    </main>
  </div>
</div><div class="toast" id="toast" role="status"></div>
<script>
const pages={
 general:{tag:'НАСТРОЙКИ',title:'Общие',desc:'Основные параметры AA Desk и его модулей.',groups:[['ЗАПУСК',[['Запускать вместе с Windows','toggle'],['Сворачивать в системный трей','toggle']]],['ВНЕШНИЙ ВИД',[['Тема приложения','select','Системная|Тёмная|Светлая'],['Язык интерфейса','select','Русский|English']]]]},
 explorer:{tag:'МОДУЛЬ',title:'Smart Explorer',desc:'Параметры быстрого поиска и работы с файлами.',groups:[['ПОВЕДЕНИЕ',[['Показывать в контекстном меню','toggle'],['Искать содержимое файлов','toggle'],['Исключить системные папки','toggle']]],['ИНДЕКСАЦИЯ',[['Расположение индекса','input','Автоматически'],['Переиндексировать файлы','button','Запустить']]]]},
 downloader:{tag:'МОДУЛЬ',title:'Downloader',desc:'Управление загрузками и расположением файлов.',groups:[['ЗАГРУЗКИ',[['Папка загрузок','input','C:\\Users\\…\\Downloads'],['Спрашивать место сохранения','toggle'],['Параллельные загрузки','select','1|2|3|4|5']]],['ПОСЛЕ ЗАГРУЗКИ',[['Проверять имя и расширение','toggle'],['Открывать папку после завершения','toggle']]]]},
 about:{tag:'AA DESK',title:'О программе',desc:'Версия и сведения о приложении.',groups:[['ПРИЛОЖЕНИЕ',[['Версия','plain','0.1.0 · прототип'],['Проверка обновлений','button','Проверить сейчас']]]]}
};
function render(key){let p=pages[key];document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));let out=`<div class="eyebrow">${p.tag}</div><h1 class="h1">${p.title}</h1><div class="desc">${p.desc}</div>`;for(const [title,rows] of p.groups){out+=`<div class="group-title">${title}</div><section class="card">`;for(const [label,type,value] of rows){let control='';if(type==='toggle')control='<button class="toggle on" role="switch" aria-checked="true" aria-label="'+label+'"></button>';if(type==='select')control='<select class="select">'+value.split('|').map(v=>`<option>${v}</option>`).join('')+'</select>';if(type==='input')control=`<input class="text-input" value="${value}" aria-label="${label}"><button class="button" data-action="browse">Обзор</button>`;if(type==='button')control=`<button class="button" data-action="${value.includes('Проверить')?'check-update':'action'}">${value}</button>`;if(type==='plain')control=`<span style="color:#aaa">${value}</span>`;out+=`<div class="row"><div class="row-label">${label}</div><div class="control">${control}</div></div>`}out+='</section>'}document.getElementById('content').innerHTML=out;document.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>{t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'))});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>notify(b.dataset.action==='check-update'?'Проверка обновлений будет подключена в приложении.':'Этот элемент пока демонстрационный.'))}
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));document.getElementById('update').onclick=()=>notify('Проверка обновлений будет подключена в приложении.');document.querySelectorAll('.module-toggle input');render('general');
</script></body></html>
